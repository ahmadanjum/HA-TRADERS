<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Billing - HATRADERS</title>

    <link
        rel="stylesheet"
        href="style.css">

    <style>

        .billing-grid {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 20px;
        }

        .billing-card {
            background: white;
            padding: 25px;
            border-radius: 10px;
        }

        .billing-card h2 {
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 11px;
            border: 1px solid #ddd;
            border-radius: 6px;
        }

        .product-row {
            display: grid;
            grid-template-columns: 2fr 1fr 1fr 1fr auto;
            gap: 10px;
            align-items: center;
            margin-bottom: 10px;
        }

        .product-row select,
        .product-row input {
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 6px;
        }

        .remove-item {
            background: #dc2626;
            color: white;
            border: none;
            padding: 9px 12px;
            border-radius: 5px;
            cursor: pointer;
        }

        .add-item-btn {
            background: #2563eb;
            color: white;
            border: none;
            padding: 11px 18px;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 10px;
        }

        .bill-summary {
            border-top: 1px solid #ddd;
            margin-top: 25px;
            padding-top: 20px;
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 12px;
            font-size: 16px;
        }

        .summary-total {
            font-size: 23px;
            font-weight: bold;

            padding-top: 15px;
        }

        .cash-box {
            margin-top: 20px;
        }

        .cash-box label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
        }

        .cash-box input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
        }

        .change {
            margin-top: 12px;
            padding: 12px;

            color: #166534;
            border-radius: 6px;
            font-weight: bold;
        }

        .invoice-btn {
            width: 100%;
            background: #22c55e;
            color: white;
            border: none;
            padding: 14px;
            margin-top: 20px;

            font-weight: bold;
        }

                grid-template-columns: 1fr;

                grid-template-columns: 1fr;
            }

        }

    </style>

</head>


<body>

<!-- MAIN -->

<main class="main-content">

    <header class="topbar">

            </h1>

                Sale Details

            <div class="form-group">

                <label>
                    Select Customer
                </label>

                <select id="customerSelect">

                    <option value="">
                        Walk-in Customer
                    </option>

                </select>

            </div>


            <h2>
                Products
            </h2>


            <!-- PRODUCTS -->

            <div id="productItems">

            </div>


            <button
                class="add-item-btn"
                onclick="addProductRow()">

                + Add Product

            </button>


        </section>



        <!-- RIGHT SIDE -->

        <section class="billing-card">

            <h2>
                Bill Summary
            </h2>


            <div class="bill-summary">

                <div class="summary-row">

                    <span>
                        Subtotal
                    </span>

                    <strong>
                        Rs. <span id="subtotal">
                            0
                        </span>
                    </strong>

                </div>



                <!-- DISCOUNT -->

                <div class="form-group">

                    <label>
                        Discount (Rs.)
                    </label>

                    <input
                        type="number"
                        id="discount"
                        value="0"
                        min="0"
                        oninput="calculateBill()">

                </div>



                <div class="summary-row">

                    <span>
                        Total
                    </span>

                    <strong class="summary-total">

                        Rs.
                        <span id="grandTotal">
                            0
                        </span>

                    </strong>

                </div>


                <!-- CASH -->

                <div class="cash-box">

                    <label>
                        Cash Received
                    </label>

                    <input
                        type="number"
                        id="cashReceived"
                        value="0"
                        min="0"
                        oninput="calculateChange()">

                </div>


                <div class="change">

                    Change:
                    Rs.
                    <span id="changeAmount">
                        0
                    </span>

                </div>


                <button
                    class="invoice-btn"
                    onclick="generateInvoice()">

                    🧾 Generate Invoice

                </button>


            </div>

        </section>

    </div>


</main>



<script>

/* ===================================
   LOAD DATA
=================================== */

let products =
    JSON.parse(
        localStorage.getItem("storeProducts")
    ) || [];


let customers =
    JSON.parse(
        localStorage.getItem("storeCustomers")
    ) || [];


let saleItems = [];



/* ===================================
   CUSTOMER DROPDOWN
=================================== */

function loadCustomers() {

    const select =
        document.getElementById(
            "customerSelect"
        );


    customers.forEach(customer => {

        const option =
            document.createElement("option");


        option.value =
            customer.id;


        option.textContent =
            customer.name +
            " - " +
            customer.phone;


        select.appendChild(option);

    });

}



/* ===================================
   ADD PRODUCT ROW
=================================== */

function addProductRow() {

    if (products.length === 0) {

        alert(
            "Please add products first."
        );

        return;

    }


    const container =
        document.getElementById(
            "productItems"
        );


    const row =
        document.createElement("div");


    row.className =
        "product-row";


    row.innerHTML = `

        <select
            class="product-select"
            onchange="updateRow(this)">

            <option value="">
                Select Product
            </option>

            ${products.map(product => `

                <option
                    value="${product.id}">

                    ${product.name}
                    - Rs. ${product.salePrice}
                    (Stock: ${product.stock})

                </option>

            `).join("")}

        </select>


        <input
            type="number"
            class="quantity"
            value="1"
            min="1"
            onchange="calculateBill()"
            placeholder="Qty">


        <input
            type="text"
            class="price"
            value="0"
            readonly>


        <input
            type="text"
            class="item-total"
            value="0"
            readonly>


        <button
            class="remove-item"
            onclick="removeProductRow(this)">

            ×

        </button>

    `;


    container.appendChild(row);

}



/* ===================================
   UPDATE PRODUCT ROW
=================================== */

function updateRow(select) {

    const row =
        select.parentElement;


    const productId =
        Number(select.value);


    const product =
        products.find(
            item => item.id == productId
        );


    if (!product) {

        row.querySelector(".price")
            .value = 0;

        row.querySelector(".item-total")
            .value = 0;

        calculateBill();

        return;

    }


    row.querySelector(".price")
        .value =
            product.salePrice;


    const quantity =
        Number(
            row.querySelector(".quantity")
                .value
        );


    row.querySelector(".item-total")
        .value =
            product.salePrice *
            quantity;


    calculateBill();

}



/* ===================================
   REMOVE ROW
=================================== */

function removeProductRow(button) {

    button
        .parentElement
        .remove();


    calculateBill();

}



/* ===================================
   CALCULATE BILL
=================================== */

function calculateBill() {

    const rows =
        document.querySelectorAll(
            ".product-row"
        );


    let subtotal = 0;


    rows.forEach(row => {

        const select =
            row.querySelector(
                ".product-select"
            );


        const quantity =
            Number(
                row.querySelector(
                    ".quantity"
                ).value
            );


        const product =
            products.find(
                item =>
                    item.id ==
                    Number(select.value)
            );


        if (product) {

            const total =
                product.salePrice *
                quantity;


            row.querySelector(
                ".price"
            ).value =
                product.salePrice;


            row.querySelector(
                ".item-total"
            ).value =
                total;


            subtotal += total;

        }

    });


    document.getElementById(
        "subtotal"
    ).innerText =
        subtotal;


    const discount =
        Number(
            document.getElementById(
                "discount"
            ).value
        ) || 0;


    let total =
        subtotal - discount;


    if (total < 0) {
        total = 0;
    }


    document.getElementById(
        "grandTotal"
    ).innerText =
        total;


    calculateChange();

}



/* ===================================
   CALCULATE CHANGE
=================================== */

function calculateChange() {

    const total =
        Number(
            document.getElementById(
                "grandTotal"
            ).innerText
        );


    const cash =
        Number(
            document.getElementById(
                "cashReceived"
            ).value
        ) || 0;


    const change =
        cash - total;


    document.getElementById(
        "changeAmount"
    ).innerText =
        change > 0
            ? change
            : 0;

}



/* ===================================
   GENERATE INVOICE
=================================== */

function generateInvoice() {

    const rows =
        document.querySelectorAll(
            ".product-row"
        );


    if (rows.length === 0) {

        alert(
            "Please add at least one product."
        );

        return;

    }


    let invoiceItems = [];

    let valid = true;


    rows.forEach(row => {

        const productId =
            Number(
                row.querySelector(
                    ".product-select"
                ).value
            );


        const quantity =
            Number(
                row.querySelector(
                    ".quantity"
                ).value
            );


        if (!productId || quantity <= 0) {

            valid = false;

            return;

        }


        const product =
            products.find(
                item =>
                    item.id == productId
            );


        if (!product) {

            valid = false;

            return;

        }


        if (quantity > product.stock) {

            alert(
                product.name +
                " has only " +
                product.stock +
                " items in stock."
            );

            valid = false;

            return;

        }


        invoiceItems.push({

            id:
                product.id,

            name:
                product.name,

            quantity:
                quantity,

            price:
                product.salePrice,

            total:
                product.salePrice *
                quantity

        });

    });


    if (!valid) {

        alert(
            "Please check your products and quantities."
        );

        return;

    }


    const subtotal =
        Number(
            document.getElementById(
                "subtotal"
            ).innerText
        );


    const discount =
        Number(
            document.getElementById(
                "discount"
            ).value
        ) || 0;


    const total =
        Number(
            document.getElementById(
                "grandTotal"
            ).innerText
        );


    const cash =
        Number(
            document.getElementById(
                "cashReceived"
            ).value
        ) || 0;


    if (cash < total) {

        alert(
            "Cash received is less than the total amount."
        );

        return;

    }


    /* Generate invoice number */

    const invoiceNumber =
        "INV-" +
        Date.now();


    /* Date */

    const date =
        new Date()
            .toLocaleString();


    /* Customer */

    const customerId =
        document.getElementById(
            "customerSelect"
        ).value;


    const customer =
        customers.find(
            item =>
                item.id ==
                customerId
        );


    const customerName =
        customer
            ? customer.name
            : "Walk-in Customer";


    /* ===================================
       REDUCE STOCK
    =================================== */

    invoiceItems.forEach(item => {

        const product =
            products.find(
                p =>
                    p.id ==
                    item.id
            );


        product.stock -=
            item.quantity;

    });


    localStorage.setItem(
        "storeProducts",
        JSON.stringify(products)
    );


    /* ===================================
       SAVE SALE
    =================================== */

    const sale = {

        invoiceNumber:
            invoiceNumber,

        date:
            date,

        customer:
            customerName,

        customerId:
            customerId || null,

        items:
            invoiceItems,

        subtotal:
            subtotal,

        discount:
            discount,

        total:
            total,

        cash:
            cash,

        change:
            cash - total

    };


    let sales =
        JSON.parse(
            localStorage.getItem(
                "storeSales"
            )
        ) || [];


    sales.push(sale);


    localStorage.setItem(
        "storeSales",
        JSON.stringify(sales)
    );


    /* ===================================
       UPDATE CUSTOMER PURCHASE
    =================================== */

    if (customer) {

        customer.purchases =
            Number(
                customer.purchases || 0
            ) + total;


        localStorage.setItem(
            "storeCustomers",
            JSON.stringify(customers)
        );

    }


    /* ===================================
       CREATE PRINTABLE INVOICE
    =================================== */

    createPrintableInvoice(
        sale
    );

}



/* ===================================
   PRINT INVOICE
=================================== */

function createPrintableInvoice(

            </title>


            <style>

                        700px;

                }


                .header {

                    text-align:

                    margin-bottom:

                }


                .header h1 {

                    margin:
                        0;

                }

                    margin:

                }


                .invoice-info {

                    justify-content:

                    margin-bottom:

                }


                table {

                    width:

                    border-collapse:

                }


                th,

                    border:

                }

                }


                .summary div {

                    display:

                    justify-content:

                    padding:

                }


                .total {

                    ${sale.items.map(item => `

                                ${item.name}

    invoiceWindow.document.close();

}



/* ===================================
   INITIALIZE
=================================== */

loadCustomers();

addProductRow();

</script>


</body>
